[project]
name = "weatherwise"
version = "0.1.0"
description = "Measure how wrong published weather forecasts are, and forecast the next week and month with honest error ranges."
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata>=2024.1",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "langchain-core>=1.8.1,<2",
    "langchain-anthropic>=1.7.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3.2", "playwright>=1.45", "httpx>=0.27"]

[project.scripts]
weatherwise = "weatherwise.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff.lint.per-file-ignores]
"scripts/mutation_check.py" = ["E501"]
"scripts/make_arch_src.py" = ["E501"]
"scripts/make_agent_arch_src.py" = ["E501"]
