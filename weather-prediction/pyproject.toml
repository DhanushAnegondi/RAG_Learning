[project]
name = "weatherwise"
version = "0.1.0"
description = "Measure how wrong published weather forecasts are, and forecast the next week and month with honest error ranges."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "sqlfluff>=3.2", "playwright>=1.45"]

[project.scripts]
weatherwise = "weatherwise.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff.lint.per-file-ignores]
"scripts/mutation_check.py" = ["E501"]
