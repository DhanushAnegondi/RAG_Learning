# Local Postgres for weatherwise. Bound to 127.0.0.1 only. Start: make up
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: weatherwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherwise}
      POSTGRES_DB: weatherwise
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15480}:5432"
    volumes:
      - weatherwise-db:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherwise -d weatherwise"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  weatherwise-db:
